# Splitch — Nginx HTTPS Reverse Proxy (Let's Encrypt or Custom/Self-Signed Cert)
# Place in /etc/nginx/sites-available/splitch.conf and symlink to sites-enabled/.
# Run Splitch bound to localhost (`splitch router --host 127.0.0.1 --port 8080`)
# with SPLITCH_API_KEY and SPLITCH_ALLOWED_ORIGINS="https://ai.example.com".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    # Allow Let's Encrypt HTTP-01 renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.com;

    # Option A: Let's Encrypt (Certbot)
    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;

    # Option B: Custom / Internal CA / Self-Signed (comment Option A above)
    # ssl_certificate     /etc/ssl/splitch/splitch.crt;
    # ssl_certificate_key /etc/ssl/splitch/splitch.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SplitchSSL:10m;
    ssl_session_tickets off;

    # Allow vision image uploads & media artifacts
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (/ws/status)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Critical for real-time SSE token streaming (/v1/chat/completions, /api/chat/*/send)
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;

        # Long timeouts for heavy local LLM & video generation jobs
        proxy_connect_timeout  15s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
    }
}
