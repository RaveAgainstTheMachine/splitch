# Splitch — HAProxy HTTPS Reverse Proxy (TLS 1.2/1.3 + WebSocket + SSE)
# Combine fullchain.pem + privkey.pem into one PEM for HAProxy:
#   cat /etc/letsencrypt/live/ai.example.com/fullchain.pem \
#       /etc/letsencrypt/live/ai.example.com/privkey.pem > /etc/haproxy/certs/ai.example.com.pem
#   chmod 600 /etc/haproxy/certs/ai.example.com.pem

global
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 10s
    timeout client  600s
    timeout server  600s
    timeout tunnel  3600s

frontend https_in
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/ai.example.com.pem alpn h2,http/1.1

    # Redirect plain HTTP -> HTTPS (preserving Let's Encrypt HTTP-01 if needed)
    acl is_acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless { ssl_fc } or is_acme

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }

    acl is_splitch hdr(host) -i ai.example.com
    use_backend splitch_backend if is_splitch

backend splitch_backend
    option httpchk GET /health
    http-check expect status 200
    # Do not buffer SSE streaming responses
    option http-no-delay
    server splitch1 127.0.0.1:8080 check inter 5s
