# Splitch — Apache HTTP Server HTTPS Reverse Proxy
# Required modules:
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite

<VirtualHost *:80>
    ServerName ai.example.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName ai.example.com

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder off

    # Option A: Let's Encrypt (Certbot)
    SSLCertificateFile    /etc/letsencrypt/live/ai.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.example.com/privkey.pem

    # Option B: Custom / Self-Signed Cert
    # SSLCertificateFile    /etc/ssl/splitch/splitch.crt
    # SSLCertificateKeyFile /etc/ssl/splitch/splitch.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # WebSocket endpoint (/ws/status)
    ProxyPass        /ws/status ws://127.0.0.1:8080/ws/status
    ProxyPassReverse /ws/status ws://127.0.0.1:8080/ws/status

    # HTTP + SSE streaming (`flushpackets=on` disables response buffering)
    ProxyPass        / http://127.0.0.1:8080/ flushpackets=on timeout=600
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
