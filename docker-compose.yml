services:
  splitch-router:
    build: .
    ports:
      # Safe localhost default; bind "8080:8080" only with SPLITCH_API_KEY enabled
      - "127.0.0.1:8080:8080"
    volumes:
      - ./splitch.toml:/app/splitch.toml:ro
      - splitch_data:/data
    environment:
      SPLITCH_CONFIG: /app/splitch.toml
      # Required before exposing Splitch beyond loopback:
      SPLITCH_API_KEY: "${SPLITCH_API_KEY:-}"
      SPLITCH_AGENT_TOKEN: "${SPLITCH_AGENT_TOKEN:-}"
    restart: unless-stopped

volumes:
  splitch_data:
