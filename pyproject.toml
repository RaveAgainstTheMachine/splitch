[project]
name = "splitch"
version = "0.23.4"
description = "Hardware-aware multi-node local AI router, Gaming-Mode GPU yielder, and unified Model/MCP/Skills/Agent control plane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psutil>=6.1.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
desktop = [
    "dbus-next>=0.2.3; sys_platform == 'linux'",
    "pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.scripts]
splitch = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/RaveAgainstTheMachine/splitch"
Repository = "https://github.com/RaveAgainstTheMachine/splitch.git"
Issues = "https://github.com/RaveAgainstTheMachine/splitch/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
